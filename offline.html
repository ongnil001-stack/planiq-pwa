<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6C5CE7">
<title>PlanIQ — Offline</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #060610;
    color: #F0EEFF;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    text-align: center;
    max-width: 320px;
  }
  .icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #6C5CE7, #A78BFA);
    border-radius: 24px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { opacity: 0.9; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #F0EEFF;
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }
  p {
    font-size: 15px;
    color: #B8B3E0;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .btn {
    display: inline-block;
    background: linear-gradient(135deg, #6C5CE7, #A78BFA);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: -0.2px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { opacity: 0.85; transform: scale(0.98); }
  .tip {
    margin-top: 24px;
    font-size: 13px;
    color: #6860B8;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="container">
  <div class="icon">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <path d="M20 8C13.373 8 8 13.373 8 20s5.373 12 12 12 12-5.373 12-12S26.627 8 20 8zm0 5v7l5 3" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="10" y1="10" x2="30" y2="30" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>PlanIQ can't reach the network right now. Once you're back online, everything will load normally.</p>
  <button class="btn" onclick="tryReload()">Try again</button>
  <p class="tip">If you installed PlanIQ as a home screen app, your last-visited screens are still available.</p>
</div>
<script>
function tryReload() {
  if (navigator.onLine) {
    window.location.href = './index.html';
  } else {
    var btn = document.querySelector('.btn');
    btn.textContent = 'Still offline...';
    setTimeout(function() { btn.textContent = 'Try again'; }, 2000);
  }
}
window.addEventListener('online', function() {
  window.location.href = './index.html';
});
</script>
</body>
</html>
